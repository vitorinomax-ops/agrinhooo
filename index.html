<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroPro 2026 | Ecossistema Digital</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <header class="navbar">
        <div class="container nav-content">
            <div class="logo">AGRO<span>PRO</span></div>
            <nav class="nav-links">
                <a href="#galeria">Mídia</a>
                <a href="#tecnologia">Tecnologias</a>
                <a href="#contato" class="btn-nav">Portal do Produtor</a>
            </nav>
            <button id="theme-toggle" aria-label="Alternar tema">
                <span class="icon-sun">☀️</span>
                <span class="icon-moon">🌙</span>
            </button>
        </div>
    </header>

    <main>
        <section class="hero container">
            <h1>Inteligência que <br><span class="gradient-text">Alimenta o Mundo</span></h1>
            <p>Conectando dados, máquinas e natureza no projeto Agrinho 2026.</p>
        </section>

        <section id="galeria" class="container section-padding">
            <h2 class="section-title">Ecossistema em Foco</h2>
            <div class="media-grid">
                <div class="media-item video-wide">
                    <iframe src="https://www.youtube.com/embed/WdVAxpc5RXA" title="Agro Sustentável" frameborder="0" allowfullscreen></iframe>
                </div>
                
                <div class="media-item">
                    <img src="https://images.unsplash.com/photo-1586771107445-d3ca888129ff?auto=format&fit=crop&q=80&w=600" alt="Plantação tecnológica">
                    <div class="overlay"><span>Bio-Tech</span></div>
                </div>
                <div class="media-item">
                    <img src="https://images.unsplash.com/photo-1560493676-04071c5f467b?auto=format&fit=crop&q=80&w=600" alt="Maquinário moderno">
                    <div class="overlay"><span>Automação</span></div>
                </div>
                <div class="media-item">
                    <img src="https://images.unsplash.com/photo-1625246333195-78d9c38ad449?auto=format&fit=crop&q=80&w=600" alt="Irrigação">
                    <div class="overlay"><span>Sustentabilidade</span></div>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
