<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroPro 2026 | Responsividade Premium</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body class="light-theme">

    <header class="navbar">
        <div class="container flex-row">
            <div class="logo">AGRO<span>PRO</span></div>
            <nav class="nav-menu">
                <a href="#tecnologia">Tecnologia</a>
                <a href="#conteudo">Conteúdo</a>
                <button id="theme-toggle" class="btn-icon">🌓</button>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero container">
            <div class="hero-inner">
                <span class="badge">Agrinho 2026</span>
                <h1>Arquitetura de Dados <br><span>no Campo</span></h1>
                <p>Estrutura otimizada para leitura em qualquer dispositivo.</p>
            </div>
        </section>

        <section id="conteudo" class="container section-padding">
            <div class="tabs-box">
                <div class="tabs-nav">
                    <button class="tab-btn active" data-tab="tab1">🌱 Bio-Tech</button>
                    <button class="tab-btn" data-tab="tab2">🛰️ Digital</button>
                </div>
                
                <div class="tabs-content">
                    <div id="tab1" class="tab-pane active">
                        <div class="content-grid">
                            <div class="text">
                                <h3>Sustentabilidade Aplicada</h3>
                                <p>Conteúdo denso organizado em colunas que se adaptam automaticamente.</p>
                            </div>
                            <div class="video-wrapper">
                                <iframe src="https://www.youtube.com/embed/WdVAxpc5RXA" frameborder="0" allowfullscreen></iframe>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="container section-padding">
            <div class="image-gallery">
                <div class="img-card"><img src="https://images.unsplash.com/photo-1592982537447-7440770cbfc9?auto=format&fit=crop&w=400" alt="Agro"></div>
                <div class="img-card"><img src="https://images.unsplash.com/photo-1625246333195-78d9c38ad449?auto=format&fit=crop&w=400" alt="Agro"></div>
                <div class="img-card"><img src="https://images.unsplash.com/photo-1560493676-04071c5f467b?auto=format&fit=crop&w=400" alt="Agro"></div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 AgroPro - Estrutura Profissional</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
