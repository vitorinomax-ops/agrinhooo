<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroSustentável | Oficial</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="container flex-nav">
            <div class="logo">Agro<span>Forte</span></div>
            <div class="btns">
                <button id="theme-btn">🌓 Tema</button>
                <button id="font-btn">A+</button>
            </div>
        </div>
    </header>

    <main>
        <section class="hero container">
            <h1>Tecnologia e <span>Natureza</span></h1>
            <p>O equilíbrio que alimenta o mundo.</p>
            <div id="user-area">
                <input type="text" id="user-name" placeholder="Seu nome...">
                <button id="main-action">Entrar</button>
            </div>
            <div id="welcome-msg" class="hidden"></div>
        </section>

        <section class="video-box">
            <div class="container">
                <div class="responsive-video">
                    <iframe src="https://www.youtube.com/embed/WdVAxpc5RXA" frameborder="0" allowfullscreen></iframe>
                </div>
            </div>
        </section>

        <section class="container content-grid">
            <div class="card">
                <h3>💧 Água</h3>
                <p>Uso inteligente e preservação de nascentes.</p>
            </div>
            <div class="card">
                <h3>🛰️ Drones</h3>
                <p>Monitoramento de precisão via satélite.</p>
            </div>
            <div class="card">
                <h3>🌱 Solo</h3>
                <p>Recuperação de áreas degradadas.</p>
            </div>
        </section>
    </main>

    <footer class="container">
        <p>Projeto Agrinho 2026</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
